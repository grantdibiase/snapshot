services:
  - type: web
    name: snapshot-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: FRONTEND_URL
        value: https://snapshot-5qjezf9yo-grantdibiases-projects.vercel.app
      - key: BACKEND_URL
        value: https://snapshot-backend-j49i.onrender.com
