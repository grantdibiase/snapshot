services:
  - type: web
    name: snapshot-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: FRONTEND_URL
        value: https://snapshot-ecru-six.vercel.app
      - key: BACKEND_URL
        value: https://snapshot-backend-j49i.onrender.com
